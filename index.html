<title>Institut Rentable · Espace élèves</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F6F3EF; --panel:#FFFFFF; --panel-2:#EFEAE4; --line:#E1D9D1; --fg:#2A2320; --muted:#7A6E66;
  --accent:#9E2E5A; --accent-soft:#F6E1E9; --accent-fg:#FFFFFF;
  --ok:#2E7D5B; --ok-soft:#DDF0E6; --warn:#B7791F; --warn-soft:#FBEBD0; --info:#3B5F8A; --info-soft:#DDE7F2;
  --display:"Fraunces","Georgia",serif; --body:"Manrope","Segoe UI",system-ui,sans-serif; --r:10px;
  --shadow:0 1px 2px rgba(42,35,32,.06),0 6px 18px rgba(42,35,32,.05);
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#1B1715; --panel:#242020; --panel-2:#2D2826; --line:#3A3330; --fg:#F0E9E3; --muted:#A79B92;
  --accent:#E07AA0; --accent-soft:#3B2430; --accent-fg:#1B1715;
  --ok:#6FCB9C; --ok-soft:#1F3A2E; --warn:#E5B35A; --warn-soft:#3E3320; --info:#8FB3DC; --info-soft:#243244;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 10px;line-height:1.2}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.note{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel-2)}
a.btn{text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .card{width:min(420px,100%)}
.spaces{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.space{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.space span{font-size:12px;color:var(--muted)}
.space.on{border-color:var(--accent);background:var(--accent-soft)}
.space.on b{color:var(--accent)}
.previewbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-fg);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.previewbar .btn{background:var(--accent-fg);color:var(--accent);border-color:transparent}
.login .brand{font-family:var(--display);font-size:26px;font-weight:600;margin-bottom:4px}

/* app */
.app{display:flex;min-height:100%}
.rail{width:220px;flex:none;padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.15;margin:0 8px 18px}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.nav{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.nav.active{background:var(--accent-soft);color:var(--accent)}
.nav:hover:not(.active){background:var(--panel-2)}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-fg);font-size:11px;padding:1px 7px;border-radius:99px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.main{flex:1;min-width:0;padding-block:24px;padding-inline:28px;max-width:1240px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--display);font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1.6fr 1fr 1.2fr 1.1fr 40px;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;min-width:0}
.row:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.row .name{font-weight:700}
.row .inst{color:var(--muted);font-size:12px}
.row .chev{color:var(--muted);text-align:right}
@media (max-width:760px){.row{grid-template-columns:1.4fr 1fr 40px}.row>.hide-m{display:none}}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.onboarding{background:var(--info-soft);color:var(--info)}
.pill.m1,.pill.m2,.pill.m3{background:var(--accent-soft);color:var(--accent)}

.detail{display:grid;grid-template-columns:1.1fr 1.3fr .9fr;gap:16px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:1000px){.detail{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.detail,.two{grid-template-columns:1fr}}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dhead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--muted);font-size:13px}
select,input[type=text],input[type=email],input[type=date],input[type=datetime-local],input[type=url],input:not([type]),textarea{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);width:100%;min-width:0}
textarea{resize:vertical;min-height:56px}
.group{margin-bottom:14px}
.check{display:flex;align-items:flex-start;gap:10px;padding:6px 4px;border-radius:6px}
.check:hover{background:var(--panel-2)}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check label{flex:1;cursor:pointer;min-width:0}
.check.done label{color:var(--muted);text-decoration:line-through}
.check .when{font-size:11px;color:var(--muted);white-space:nowrap}
.check .rm{border:0;background:none;color:var(--muted);padding:0 4px;font-size:16px;line-height:1;opacity:0}
.check:hover .rm{opacity:1}
.check.locked{opacity:.75}
.addline{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.addline input,.addline select{flex:1}
.addline input{min-width:140px}
.months{display:flex;flex-direction:column;gap:12px}
.month{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--bg)}
.month .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.month .mh b{font-family:var(--display);font-size:16px}
.month .mh span{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.field label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
.field input,.field textarea{font-variant-numeric:tabular-nums}
.field.wide{grid-column:1/-1}
.coach{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.coach input{accent-color:var(--accent);width:16px;height:16px}
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:150px;padding:8px 4px 0;position:relative;margin-bottom:6px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .col i{display:block;width:100%;max-width:56px;background:var(--accent-soft);border:1px solid var(--accent);border-bottom:0;border-radius:6px 6px 0 0;min-height:2px}
.chart .col.hit i{background:var(--ok-soft);border-color:var(--ok)}
.chart .col em{font-style:normal;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.chart .col span{font-size:11px;color:var(--muted)}
.chart .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--warn);font-size:10px;color:var(--warn);text-align:right;padding-right:2px;pointer-events:none}
.gap{color:var(--muted);font-size:13px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .field.wide{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(20,14,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
.empty{color:var(--muted);text-align:center;padding:30px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;z-index:20}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .s{font-size:12px;color:var(--muted)}
.item .rm{border:0;background:none;color:var(--muted);font-size:16px}
.thread{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto;padding:4px 0}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--panel-2);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msg.me{background:var(--accent-soft);align-self:flex-end}
.msg .s{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.compose{display:flex;gap:6px;margin-top:8px}
.compose textarea{flex:1;min-height:40px}
.prospect{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.prospect.closed{opacity:.7}
.pname{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcontact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pcontact a{text-decoration:none}
.pstage{display:flex;flex-direction:column;gap:6px;min-width:0}
.pacts{display:flex;gap:6px;flex-wrap:wrap}
.pnote{min-height:36px;font-size:12px}

/* Code couleur CRM */
.prospect{border-left:5px solid var(--line)}
.prospect.cat-nouveau{border-left-color:var(--info);background:color-mix(in srgb,var(--info-soft) 45%,var(--panel))}
.prospect.cat-rappel{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn-soft) 55%,var(--panel))}
.prospect.cat-encours{border-left-color:var(--accent)}
.prospect.cat-cliente{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 60%,var(--panel));opacity:1}
.prospect.cat-perdue{border-left-color:var(--line);opacity:.6}
.prospect.cat-perdue .pname{text-decoration:line-through;text-decoration-color:var(--muted)}
.chip-nouveau.on{background:var(--info);border-color:var(--info)}
.chip-rappel.on{background:var(--warn);border-color:var(--warn)}
.chip-cliente.on{background:var(--ok);border-color:var(--ok)}
.chip-perdue.on{background:var(--muted);border-color:var(--muted)}
.chip-nouveau:not(.on){border-color:var(--info);color:var(--info)}
.chip-rappel:not(.on){border-color:var(--warn);color:var(--warn)}
.chip-cliente:not(.on){border-color:var(--ok);color:var(--ok)}
.prospect.late{border-color:var(--line);border-left-color:var(--warn)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.money label{color:var(--muted);font-weight:600}
.money input{margin-top:2px;padding:5px 8px}
.money select{grid-column:1/-1;padding:5px 8px;font-size:12px}
.tile.warnt{border-color:var(--warn)}
@media (max-width:640px){.prospect{grid-template-columns:1fr}}

.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}.tbl td{padding:8px;border-bottom:1px solid var(--line)}.tbl tr:hover td{background:var(--panel-2)}
.item.todo .t{font-weight:500}
.coachbox{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.cr{margin-top:6px;padding:8px 10px;background:var(--panel-2);border-radius:8px;font-size:13px;white-space:pre-wrap}
.renta .rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.tile.hero{background:var(--accent-soft);border-color:var(--accent)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:99px;font-weight:600;font-size:13px;color:var(--muted)}

.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:4px 0}
.day{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--bg);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}

.post.a_faire,.sw.a_faire{background:var(--warn-soft);color:var(--warn)}

.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}

.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
@media (max-width:1000px){.two[style]{grid-template-columns:1fr!important}}
@media (max-width:640px){.day{min-height:54px}.post{font-size:10px;padding:1px 3px}}
.welcome{background:linear-gradient(135deg,var(--accent-soft),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}

.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stage div{padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.stage div.on{border-color:var(--accent);color:var(--accent);font-weight:700}

@media (max-width:760px){
  .app{flex-direction:column}
  .rail{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:4px}

}
</style>

function cat(p){ const now=new Date(); if(p.statut==="won")return "cliente"; if(p.statut==="lost"||p.statut==="abandoned")return "perdue";
  if(p.rappel_le&&new Date(p.rappel_le)<=new Date(now.getTime()+864e5*0+86399999)&&startOfDay(p.rappel_le)<=startOfDay(now))return "rappel";
  if(!p.derniere_action&&!p.nb_tentatives)return "nouveau"; return "encours"; }
const CATS=[["rappel","À rappeler"],["nouveau","Nouveaux"],["encours","En cours"],["cliente","Clientes"],["perdue","Perdues"],["tous","Tous"]];
function prospectStats(list,budgetPub){
  const won=list.filter(p=>p.statut==="won"), lost=list.filter(p=>p.statut==="lost"||p.statut==="abandoned"), open=list.filter(p=>p.statut==="open");
  const ca=list.reduce((s,p)=>s+(num(p.montant)||(p.statut==='won'?num(p.valeur)||0:0)),0); const closed=won.length+lost.length; const acAtt=list.filter(p=>p.acompte_statut==='en_attente'); const acAttSum=acAtt.reduce((s,p)=>s+(num(p.acompte)||0),0); const acPaye=list.filter(p=>p.acompte_statut==='paye').reduce((s,p)=>s+(num(p.acompte)||0),0);
  const rappels=list.filter(p=>cat(p)==="rappel").length, nouveaux=list.filter(p=>cat(p)==="nouveau").length;
  return {acAtt:acAtt.length,acAttSum,acPaye,total:list.length,open:open.length,won:won.length,lost:lost.length,ca,taux:closed?Math.round(won.length/closed*100):null,rappels,nouveaux,
    budget:budgetPub||0, roi:budgetPub?ca/budgetPub:null, cpl:budgetPub&&list.length?budgetPub/list.length:null, cpa:budgetPub&&won.length?budgetPub/won.length:null, panier:won.length?ca/won.length:null};
}

        <div class="card"><h2>Idées rapides</h2><div class="note" style="margin-bottom:8px">Issu de la méthode Réseaux Rentables. Clique pour ajouter en brouillon.</div><div class="list" style="gap:4px">${["Avant / après d'une cliente (avec son accord)","Coulisses : ton rituel d'ouverture","3 idées reçues sur ta prestation phare","Témoignage client en story à la une","Offre du mois : rappel clair + lien de RDV","Toi face caméra : pourquoi ce métier"].map(i=>`<button class="btn small" style="justify-content:flex-start;text-align:left" data-idea="${esc(i)}">💡 ${esc(i)}</button>`).join("")}</div></div>
      </div></div>`;
    $("#prevM").onclick=()=>{this.month=new Date(m.getFullYear(),m.getMonth()-1,1);this.render(main,{eleveId,prenom,canConnect,eleveNames,adminSelect})};
    $("#nextM").onclick=()=>{this.month=new Date(m.getFullYear(),m.getMonth()+1,1);this.render(main,{eleveId,prenom,canConnect,eleveNames,adminSelect})};
    const reload=()=>this.render(main,{eleveId,prenom,canConnect,eleveNames,adminSelect});
    $("#newPost").onclick=()=>this.edit(null,{eleveId,date:todayS},reload);
    const ci=$("#connectIG"); if(ci) ci.onclick=()=>toast("La connexion Instagram/Facebook arrive avec la publication automatique.");
    main.querySelectorAll("[data-post]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();this.edit(list.find(p=>p.id===b.dataset.post),{eleveId},reload)});
    main.querySelectorAll("[data-day]").forEach(d=>d.onclick=()=>this.edit(null,{eleveId,date:d.dataset.day},reload));
    main.querySelectorAll("[data-idea]").forEach(b=>b.onclick=async()=>{const {error}=await sb.from("ir_posts").insert({eleve_id:eleveId,date_prevue:todayS,titre:b.dataset.idea,statut:"idee",canal:"instagram",type:"post"});if(error)return err(error);toast("Idée ajoutée au calendrier");reload()});
  },
  edit(p,{eleveId,date},onDone){
    const isNew=!p; p=p||{date_prevue:date,canal:"instagram",type:"post",statut:"a_faire",heure:"",titre:"",legende:"",visuel_url:""};
    modal(`<h2>${isNew?"Nouveau contenu":"Contenu"}</h2><div class="form">

      <div class="field"><label>Format</label><select id="p-type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${p.type===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field wide"><label>Titre / idée</label><input id="p-titre" value="${esc(p.titre||"")}" placeholder="ex. Avant/après Hydralift"></div>
      <div class="field wide"><label>Légende</label><textarea id="p-leg" style="min-height:110px" placeholder="Accroche en première ligne, puis le message, puis l'appel à l'action.">${esc(p.legende||"")}</textarea></div>
      <div class="field wide"><label>Lien du visuel (Canva, Drive…)</label><input id="p-vis" type="url" value="${esc(p.visuel_url||"")}"></div>
      <div class="field wide"><label>Statut</label><select id="p-stat">${Object.entries(PSTAT).map(([k,v])=>`<option value="${k}" ${p.statut===k?"selected":""}>${v[0]}</option>`).join("")}</select></div></div>
      <div class="actions">${isNew?"":`<button class="btn danger" id="del">Supprimer</button>`}<button class="btn" id="cancel">Annuler</button><button class="btn primary" id="ok">${isNew?"Ajouter":"Enregistrer"}</button></div>`);
    $("#cancel").onclick=closeModal;
    $("#ok").onclick=async()=>{const g=id=>$("#"+id).value;const d={eleve_id:p.eleve_id||eleveId,date_prevue:g("p-date"),heure:g("p-heure").trim(),canal:g("p-canal"),type:g("p-type"),titre:g("p-titre").trim(),legende:g("p-leg"),visuel_url:g("p-vis").trim(),statut:g("p-stat")};
      if(!d.date_prevue)return toast("Choisis une date"); if(!d.eleve_id)return toast("Choisis une élève");
      const {error}=isNew?await sb.from("ir_posts").insert(d):await sb.from("ir_posts").update(d).eq("id",p.id); if(error)return err(error); closeModal(); toast(isNew?"Contenu ajouté":"Enregistré"); onDone();};
    const del=$("#del"); if(del) del.onclick=async()=>{await sb.from("ir_posts").delete().eq("id",p.id);closeModal();toast("Supprimé");onDone()};
  }
};

const Admin={
  view:"dash", current:null, eleves:[], tpl:[],
  async start(){ await this.load(); this.shell(); this.render(); },
  async load(){

    const {data:s}=await sb.from("ir_suivi").select("*"); this.suivi={}; (s||[]).forEach(r=>{(this.suivi[r.eleve_id]=this.suivi[r.eleve_id]||{})[r.mois]=r});
    const {data:m}=await sb.from("ir_messages").select("eleve_id").eq("auteur","eleve").eq("lu",false); this.unread={}; (m||[]).forEach(r=>this.unread[r.eleve_id]=(this.unread[r.eleve_id]||0)+1);

  shell(){
    root.innerHTML=`<div class="app"><aside class="rail"><div class="brand">Institut Rentable<small>Espace coach</small></div>
      <button class="nav" data-view="dash">Tableau de bord</button><button class="nav" data-view="eleves">Élèves <span class="badge" id="ubadge" hidden></span></button><button class="nav" data-view="prospects">Prospects</button><button class="nav" data-view="inbox">Messages <span class="badge" id="ibadge" hidden></span></button><button class="nav" data-view="reseaux">Réseaux sociaux</button><button class="nav" data-view="formation">Formation</button><button class="nav" data-view="tpl">Modèle d'onboarding</button><button class="nav" data-view="reglages">Réglages</button>
      <div class="foot"><span>${esc(session.user.email)}</span><button class="btn small" id="out">Se déconnecter</button></div></aside><main class="main" id="main"></main></div>`;

  },
  pct(id){const p=this.prog[id]||{done:0,total:0};return {...p,pct:p.total?Math.round(p.done/p.total*100):0}},
  lastCA(e){const s=this.suivi[e.id]||{};for(const m of [3,2,1]){if(s[m]?.ca!=null)return s[m].ca}return e.ca_depart},
  render(){
    root.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.view===this.view));

    if(this.view==="dash") this.dash(); else if(this.view==="eleves") this.current?this.detail():this.list(); else if(this.view==="prospects") this.prospects(); else if(this.view==="inbox") this.inbox(); else if(this.view==="reseaux") this.reseaux(); else if(this.view==="formation") Formation.render($("#main"),{admin:true}); else if(this.view==="reglages") this.reglages(); else this.template();
  },
  rowHTML(e){const p=this.pct(e.id),ca=this.lastCA(e),un=this.unread[e.id];

  formation(){ Formation.render($("#main"),{prenom:me.prenom}); },
  async msg(){
    $("#main").innerHTML=`<div class="topbar"><div><h1>Messages</h1><p class="sub">Une question, un blocage ? Écris ici, Cindy te répond.</p></div></div><div class="card"><div class="thread" id="thread" style="max-height:60vh">${this.msgs.length?this.msgs.map(m=>`<div class="msg ${m.auteur==="eleve"?"me":""}">${esc(m.contenu)}<span class="s">${m.auteur==="cindy"?"Cindy":"Moi"} · ${dtfr(m.created_at)}</span></div>`).join(""):`<div class="note">Aucun message pour l'instant.</div>`}</div>
    <div class="compose"><textarea id="msgIn" placeholder="Écris ton message…"></textarea><button class="btn primary" id="msgSend">Envoyer</button></div></div>`;
    const th=$("#thread"); th.scrollTop=th.scrollHeight;
    if(this.unread){ await sb.from("ir_messages").update({lu:true}).eq("eleve_id",me.id).eq("auteur","cindy").eq("lu",false); this.unread=0; $("#ubadge").hidden=true; }
    $("#msgSend").onclick=async()=>{const v=$("#msgIn").value.trim();if(!v)return;const {error}=await sb.from("ir_messages").insert({eleve_id:me.id,auteur:"eleve",contenu:v});if(error)return err(error);await this.load();this.render()};
  }
};

boot();
</script>
</body>
</html>
